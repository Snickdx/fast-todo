<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    # A(i) Document root for static assets


    # A(ii) Reverse proxy application traffic to FastAPI (uvicorn) on port 5000
    # Serve /static from DocumentRoot; proxy everything else to the app



    <Directory /var/www/html/app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/app_error.log
    CustomLog ${APACHE_LOG_DIR}/app_access.log combined
</VirtualHost>
