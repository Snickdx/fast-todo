<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Taskline{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#1a2332",
              slate: "#4a5568",
              mist: "#e8eef4",
              paper: "#f7fafc",
              accent: "#0f766e",
              "accent-dark": "#0b5c56",
              danger: "#b91c1c",
            },
            fontFamily: {
              display: ["Fraunces", "Georgia", "serif"],
              sans: ["Manrope", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="font-sans text-ink min-h-screen">
    {% block content %}{% endblock %}
  </body>
</html>
